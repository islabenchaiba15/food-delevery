version: 2

models:
  - name: orders
    description: "Cleaned and normalized order data from the bronze layer."
    columns:
      - name: order_id
        description: "Primary key for the order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to the users/customers table."
        tests:
          - not_null
      - name: restaurant_id
        description: "Foreign key to the restaurants table."
        tests:
          - not_null
      - name: order_at
        description: "Combined timestamp of the order date and time."
      - name: total_paid_amount
        description: "The total amount paid by the customer, including tax, fees, and tips."
      - name: customer_rating
        description: "Rating provided by the customer (1-5)."
