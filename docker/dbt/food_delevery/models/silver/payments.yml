version: 2

models:
  - name: payments
    description: "Cleaned and normalized payment data from the bronze layer, including fraud risk levels and net revenue calculations."
    columns:
      - name: payment_id
        description: "Primary key for the payment transaction."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key linking to the orders table."
        tests:
          - not_null

      - name: payment_at
        description: "Timestamp when the payment was processed."

      - name: amount_abs
        description: "The absolute value of the payment amount (handles cases where data was incorrectly recorded as negative)."
        tests:
          - not_null

      - name: status
        description: "The current status of the payment (e.g., Success, Failed, Refunded)."
        tests:
          - accepted_values:
              values: ['Success', 'Failed', 'Refunded', 'Pending']

      - name: fraud_risk_level
        description: "Risk bucket based on the fraud score (Low, Medium, High)."
