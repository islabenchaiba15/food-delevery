version: 2

models:
  - name: reviews
    description: "Cleaned and normalized review data, including rating standardization and sentiment analysis."
    columns:
      - name: review_id
        description: "Primary key for each review."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key linking to the orders table."
        tests:
          - not_null

      - name: rating_overall
        description: "Primary customer rating (1-5)."
        tests:
          - not_null

      - name: sentiment
        description: "Standardized sentiment classification (Positive, Neutral, Negative, etc.)."

      - name: is_conflicting_sentiment
        description: "Anomaly flag: TRUE if the sentiment is Negative but the rating is high (4-5)."
