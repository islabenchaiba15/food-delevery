version: 2

models:
  - name: delivery
    description: "Cleaned and normalized delivery performance data, including delay calculations and redelivery flags."
    columns:
      - name: delivery_id
        description: "Primary key for the delivery."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key linking to the orders table."
        tests:
          - not_null

      - name: driver_id
        description: "Foreign key linking to the drivers table."
        tests:
          - not_null

      - name: status
        description: "Standardized status (Delivered, Failed, In Transit, Returned)."
        tests:
          - accepted_values:
              values: ['Delivered', 'Failed', 'In Transit', 'Returned', 'Partial']

      - name: delay_min
        description: "The difference between actual and estimated delivery times (positive = late, negative = early)."

      - name: avg_speed_kmh
        description: "Calculated average speed of the delivery in kilometers per hour."
      - name: is_late
        description: "Boolean flag set to true if the actual delivery time exceeded the estimate."
